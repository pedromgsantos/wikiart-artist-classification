# Project configuration for WikiArt image classification

# Global Paths
paths:
  train_dir: "../data/train"
  val_dir: "../data/val"
  test_dir: "../data/test"
  models_dir: "../models"
  results_dir: "../models_results"

# Global Data/Training
img_size: [224, 224]
num_classes: 23
max_epochs: 60
seed: 42

# Model-specific configs
models:
  baseline:
    checkpoint: "../models/baseline/baseline_best.keras"
    history: "../models_results/baseline/baseline_history.json"
    batch_size: 32
  resnet50:
    checkpoint: "../models/resnet50/resnet50_best.keras"
    history: "../models_results/resnet50/resnet50_history.json"
    batch_size: 32
  residual_block:
    checkpoint: "../models/residual_block/residual_block_best.keras"
    history: "../models_results/residual_block/residual_block_history.json"
    batch_size: 32
